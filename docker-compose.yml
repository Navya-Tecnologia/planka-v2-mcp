version: '3.8'

services:
  planka-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planka-mcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MCP_TRANSPORT=sse
      - PORT=3000
      - HOST=0.0.0.0
      - PLANKA_BASE_URL=${PLANKA_BASE_URL}
      - PLANKA_AGENT_EMAIL=${PLANKA_AGENT_EMAIL:-}
      - PLANKA_AGENT_PASSWORD=${PLANKA_AGENT_PASSWORD:-}
      - PLANKA_IGNORE_SSL=${PLANKA_IGNORE_SSL:-false}
      - PLANKA_ALLOWED_HOSTS=${PLANKA_ALLOWED_HOSTS:-}
      - ALLOW_ANONYMOUS_ENV_FALLBACK=${ALLOW_ANONYMOUS_ENV_FALLBACK:-true}
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_SKILL_FILE_PATH=${MCP_SKILL_FILE_PATH:-/app/docs/skills/planka-kanban-skill.md}
    networks:
      - net_mcp

networks:
  net_mcp:
    external: true
